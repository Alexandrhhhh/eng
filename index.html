<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOCAB.TERMINAL</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090a;
    --surface: #111113;
    --surface-2: #17171a;
    --border: #262629;
    --border-hi: #3c3c40;
    --text: #ececea;
    --text-dim: #737377;
    --text-faint: #45454a;
    --accent: #ff9500;
    --accent-dim: #7a4b00;
    --up: #14c766;
    --up-dim: #0d3d24;
    --down: #ff4136;
    --down-dim: #4a1512;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
  }

  body {
    font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 76px;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 14px;
  }

  /* ---- Header / ticker ---- */
  header {
    padding: 18px 14px 0;
    max-width: 560px;
    margin: 0 auto;
  }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .brand .name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.5px;
  }

  .brand .name .dim {
    color: var(--accent);
  }

  .brand .clock {
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.5px;
  }

  .ticker {
    display: flex;
    margin-top: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  .ticker .stat {
    flex: 1;
    padding: 9px 10px;
    border-right: 1px solid var(--border);
  }

  .ticker .stat:last-child { border-right: none; }

  .ticker .stat .label {
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .ticker .stat .value {
    font-size: 15px;
    font-weight: 700;
    margin-top: 3px;
    letter-spacing: 0.3px;
  }

  .ticker .stat .value.accent { color: var(--accent); }
  .ticker .stat .value.up { color: var(--up); }

  /* ---- Tab content wrapper ---- */
  main { max-width: 560px; margin: 0 auto; padding: 14px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.18s ease; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ---- Form panel ---- */
  .panel {
    border: 1px solid var(--border);
    background: var(--surface);
    margin-bottom: 18px;
  }

  .panel-head {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .panel-body { padding: 14px 12px; }

  .field { margin-bottom: 12px; }
  .field:last-of-type { margin-bottom: 0; }

  .field label {
    display: block;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field input {
    width: 100%;
    padding: 11px 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    outline: none;
    border-radius: 0;
    transition: border-color 0.15s;
  }

  .field input::placeholder { color: var(--text-faint); }
  .field input:focus { border-color: var(--accent); }

  .btn-primary {
    width: 100%;
    padding: 12px;
    margin-top: 14px;
    border: 1px solid var(--accent);
    border-radius: 0;
    background: var(--accent);
    color: #0a0a0a;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .btn-primary:active { background: #cc7900; border-color: #cc7900; }

  /* ---- Word blotter (list) ---- */
  .list-head {
    display: flex;
    padding: 0 12px 6px;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .list-head .col-idx { width: 30px; }
  .list-head .col-term { flex: 1; }
  .list-head .col-status { width: 46px; text-align: right; }

  .word-list { border: 1px solid var(--border); background: var(--surface); }

  .word-item {
    display: flex;
    align-items: center;
    padding: 11px 12px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }

  .word-item:last-child { border-bottom: none; }

  .word-item .idx {
    width: 24px;
    font-size: 11px;
    color: var(--text-faint);
    flex-shrink: 0;
  }

  .word-item .texts { flex: 1; min-width: 0; }

  .word-item .en {
    font-size: 14.5px;
    font-weight: 600;
    word-break: break-word;
  }

  .word-item .ru {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 2px;
    word-break: break-word;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    flex-shrink: 0;
    background: var(--text-faint);
  }

  .status-dot.known { background: var(--up); }

  .delete-btn {
    background: none;
    border: 1px solid var(--border-hi);
    color: var(--down);
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 0;
  }

  .delete-btn:active { background: var(--down-dim); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 46px 20px;
    font-size: 13px;
    border: 1px dashed var(--border);
    line-height: 1.7;
  }

  .empty-state .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 1.5px;
    color: var(--text-faint);
    border: 1px solid var(--border);
    padding: 3px 8px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }

  /* ---- Flashcards ---- */
  .flash-progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-size: 11px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .flash-progress-row .accent { color: var(--accent); font-weight: 700; }

  .progress-bar {
    height: 3px;
    background: var(--border);
    margin-bottom: 22px;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .flashcard {
    width: 100%;
    height: 230px;
    perspective: 1200px;
    cursor: pointer;
    margin-bottom: 20px;
  }

  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.4s;
    transform-style: preserve-3d;
  }

  .flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
  }

  .flashcard-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border: 1px solid var(--border-hi);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .flashcard-back { transform: rotateY(180deg); border-color: var(--accent); }

  .flashcard-tag {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: 9px;
    letter-spacing: 1.5px;
    color: var(--text-faint);
  }

  .flashcard-face.flashcard-back .flashcard-tag { color: var(--accent); }

  .flashcard-word {
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.2px;
    line-height: 1.3;
  }

  .flashcard-hint {
    position: absolute;
    bottom: 12px;
    font-size: 10px;
    letter-spacing: 1px;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .flash-actions {
    display: flex;
    gap: 10px;
  }

  .btn-remember, .btn-repeat {
    flex: 1;
    padding: 13px 6px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 0;
    background: var(--surface);
  }

  .btn-remember {
    border: 1px solid var(--up);
    color: var(--up);
  }

  .btn-remember:active { background: var(--up-dim); }

  .btn-repeat {
    border: 1px solid var(--down);
    color: var(--down);
  }

  .btn-repeat:active { background: var(--down-dim); }

  /* ---- Bottom tab bar ---- */
  .tabs {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }

  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    border-top: 2px solid transparent;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    padding: 13px 4px 11px;
    cursor: pointer;
  }

  .tab-btn.active {
    color: var(--accent);
    border-top-color: var(--accent);
  }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-14px);
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border-hi);
    padding: 9px 16px;
    font-size: 12px;
    letter-spacing: 0.3px;
    opacity: 0;
    transition: all 0.2s ease;
    z-index: 999;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="name">VOCAB<span class="dim">.</span>TERMINAL</span>
    <span class="clock" id="clock"></span>
  </div>
  <div class="ticker">
    <div class="stat">
      <div class="label">Words</div>
      <div class="value" id="stat-total">0</div>
    </div>
    <div class="stat">
      <div class="label">Learned</div>
      <div class="value up" id="stat-learned">0</div>
    </div>
    <div class="stat">
      <div class="label">Progress</div>
      <div class="value accent" id="stat-progress">0%</div>
    </div>
  </div>
</header>

<main>
  <!-- ==== TAB 1: DICTIONARY ==== -->
  <div id="tab-dictionary" class="tab-content active">
    <div class="panel">
      <div class="panel-head">Новая запись</div>
      <div class="panel-body">
        <div class="field">
          <label for="input-word">Слово / фраза</label>
          <input id="input-word" type="text" placeholder="to give up" autocomplete="off">
        </div>
        <div class="field">
          <label for="input-translation">Перевод</label>
          <input id="input-translation" type="text" placeholder="сдаваться" autocomplete="off">
        </div>
        <button class="btn-primary" id="save-btn">Добавить в словарь</button>
      </div>
    </div>

    <div class="list-head">
      <span class="col-idx">#</span>
      <span class="col-term">Term / Перевод</span>
      <span class="col-status">Статус</span>
    </div>
    <div id="word-list"></div>
  </div>

  <!-- ==== TAB 2: FLASHCARDS ==== -->
  <div id="tab-flashcards" class="tab-content">
    <div id="flash-wrap"></div>
  </div>
</main>

<div class="tabs">
  <button class="tab-btn active" data-tab="dictionary">Словарь</button>
  <button class="tab-btn" data-tab="flashcards">Тренировка</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  const STORAGE_KEY = 'english_words_v1';

  function loadWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveWords(words) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(words));
  }

  let words = loadWords();

  // ---------- Clock ----------
  function updateClock() {
    const el = document.getElementById('clock');
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    el.textContent = `${h}:${m}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ---------- Toast ----------
  function showToast(text) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  // ---------- Stats ticker ----------
  function renderStats() {
    const total = words.length;
    const learned = words.filter(w => w.known).length;
    const progress = total ? Math.round((learned / total) * 100) : 0;
    document.getElementById('stat-total').textContent = String(total).padStart(2, '0');
    document.getElementById('stat-learned').textContent = String(learned).padStart(2, '0');
    document.getElementById('stat-progress').textContent = progress + '%';
  }

  // ---------- Tabs ----------
  const tabButtons = document.querySelectorAll('.tab-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

      if (btn.dataset.tab === 'flashcards') {
        initFlashcards();
      }
      tg?.HapticFeedback?.impactOccurred('light');
    });
  });

  // ---------- Dictionary tab ----------
  const wordInput = document.getElementById('input-word');
  const translationInput = document.getElementById('input-translation');
  const saveBtn = document.getElementById('save-btn');
  const wordListEl = document.getElementById('word-list');

  function renderWordList() {
    wordListEl.innerHTML = '';
    renderStats();

    if (words.length === 0) {
      wordListEl.innerHTML = `
        <div class="empty-state">
          <span class="tag">Пусто</span><br>
          Ни одной записи в словаре.<br>Добавь первое слово в форме выше.
        </div>`;
      return;
    }

    const listBox = document.createElement('div');
    listBox.className = 'word-list';

    [...words].reverse().forEach((w, i) => {
      const item = document.createElement('div');
      item.className = 'word-item';
      item.innerHTML = `
        <div class="idx">${String(words.length - i).padStart(2, '0')}</div>
        <div class="texts">
          <div class="en"></div>
          <div class="ru"></div>
        </div>
        <div class="status-dot ${w.known ? 'known' : ''}"></div>
        <button class="delete-btn" data-id="${w.id}">×</button>
      `;
      item.querySelector('.en').textContent = w.word;
      item.querySelector('.ru').textContent = w.translation;
      listBox.appendChild(item);
    });

    wordListEl.appendChild(listBox);

    wordListEl.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        words = words.filter(w => String(w.id) !== String(id));
        saveWords(words);
        renderWordList();
        tg?.HapticFeedback?.notificationOccurred('warning');
      });
    });
  }

  saveBtn.addEventListener('click', () => {
    const word = wordInput.value.trim();
    const translation = translationInput.value.trim();

    if (!word || !translation) {
      showToast('Заполни оба поля');
      tg?.HapticFeedback?.notificationOccurred('error');
      return;
    }

    words.push({
      id: Date.now(),
      word,
      translation,
      known: false
    });
    saveWords(words);

    wordInput.value = '';
    translationInput.value = '';
    renderWordList();
    showToast('Запись добавлена');
    tg?.HapticFeedback?.notificationOccurred('success');
  });

  renderWordList();

  // ---------- Flashcards tab ----------
  const flashWrap = document.getElementById('flash-wrap');
  let deck = [];
  let currentIndex = 0;
  let deckTotal = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initFlashcards() {
    words = loadWords();

    if (words.length === 0) {
      flashWrap.innerHTML = `
        <div class="empty-state">
          <span class="tag">Нет данных</span><br>
          Добавь слова во вкладке «Словарь»,<br>чтобы начать тренировку.
        </div>`;
      return;
    }

    deck = shuffle(words);
    deckTotal = deck.length;
    currentIndex = 0;
    renderCard();
  }

  function renderCard() {
    if (currentIndex >= deck.length) {
      flashWrap.innerHTML = `
        <div class="empty-state">
          <span class="tag">Сессия завершена</span><br>
          Все карточки пройдены.<br>Отличная работа.
        </div>
        <button class="btn-primary" id="restart-btn" style="margin-top:16px;">Начать заново</button>
      `;
      document.getElementById('restart-btn').addEventListener('click', initFlashcards);
      return;
    }

    const card = deck[currentIndex];
    const fillPct = Math.round((currentIndex / deckTotal) * 100);

    flashWrap.innerHTML = `
      <div class="flash-progress-row">
        <span>Card <span class="accent">${String(currentIndex + 1).padStart(2, '0')}</span> / ${String(deckTotal).padStart(2, '0')}</span>
        <span>${fillPct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-bar-fill" style="width:${fillPct}%"></div></div>

      <div class="flashcard" id="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <span class="flashcard-tag">EN</span>
            <div class="flashcard-word"></div>
            <span class="flashcard-hint">Tap to flip</span>
          </div>
          <div class="flashcard-face flashcard-back">
            <span class="flashcard-tag">RU</span>
            <div class="flashcard-word"></div>
            <span class="flashcard-hint">Translation</span>
          </div>
        </div>
      </div>
      <div class="flash-actions">
        <button class="btn-repeat" id="btn-repeat">▼ Повторить</button>
        <button class="btn-remember" id="btn-remember">▲ Помню</button>
      </div>
    `;

    flashWrap.querySelector('.flashcard-front .flashcard-word').textContent = card.word;
    flashWrap.querySelector('.flashcard-back .flashcard-word').textContent = card.translation;

    const flashcardEl = document.getElementById('flashcard');
    flashcardEl.addEventListener('click', () => {
      flashcardEl.classList.toggle('flipped');
      tg?.HapticFeedback?.impactOccurred('light');
    });

    document.getElementById('btn-remember').addEventListener('click', (e) => {
      e.stopPropagation();
      const original = words.find(w => w.id === card.id);
      if (original) {
        original.known = true;
        saveWords(words);
      }
      tg?.HapticFeedback?.notificationOccurred('success');
      nextCard();
    });

    document.getElementById('btn-repeat').addEventListener('click', (e) => {
      e.stopPropagation();
      deck.push(card);
      tg?.HapticFeedback?.notificationOccurred('warning');
      nextCard();
    });
  }

  function nextCard() {
    currentIndex++;
    renderCard();
  }
</script>

</body>
</html>
