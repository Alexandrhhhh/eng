<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matura Vocab · EN · PL · RU</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #263449;
    --border: rgba(148, 163, 184, 0.14);
    --border-soft: rgba(148, 163, 184, 0.08);
    --text: #f1f5f9;
    --text-dim: #94a3b8;
    --text-faint: #64748b;
    --accent: #8b5cf6;
    --accent-2: #7c3aed;
    --accent-soft: rgba(139, 92, 246, 0.16);
    --green: #34d399;
    --green-soft: rgba(52, 211, 153, 0.15);
    --red: #f87171;
    --red-soft: rgba(248, 113, 113, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { background: var(--bg); }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 92px;
    -webkit-font-smoothing: antialiased;
  }

  #app { max-width: 560px; margin: 0 auto; }

  /* ---------- Header ---------- */
  .app-header { padding: 18px 16px 4px; }

  .app-header h1 {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .app-header .sub {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 2px;
    font-weight: 500;
  }

  .stats-card {
    margin-top: 14px;
    background: linear-gradient(160deg, var(--card), var(--card-2));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .stats-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }

  .stats-row .label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .stats-row .value {
    font-size: 14px;
    font-weight: 700;
  }

  .stats-row .value b { color: var(--accent); font-size: 16px; }

  .progress-track {
    height: 8px;
    border-radius: 99px;
    background: rgba(148,163,184,0.12);
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), #c4b5fd);
    transition: width 0.35s ease;
  }

  /* ---------- Main / tabs ---------- */
  main { padding: 16px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fadeIn 0.2s ease; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- Add panel ---------- */
  .add-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }

  .add-panel .title {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  .add-panel .hint {
    font-size: 12.5px;
    color: var(--text-faint);
    margin-bottom: 12px;
    line-height: 1.5;
  }

  .word-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    font-size: 15.5px;
    outline: none;
    transition: border-color 0.15s;
  }

  .word-input::placeholder { color: var(--text-faint); }
  .word-input:focus { border-color: var(--accent); }

  .lang-chips {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .lang-chip {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 9px 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--text-dim);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }

  .lang-chip.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--text);
  }

  .btn-add {
    width: 100%;
    margin-top: 14px;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(139,92,246,0.35);
    transition: transform 0.1s, opacity 0.15s;
  }

  .btn-add:active { transform: scale(0.98); }
  .btn-add:disabled { opacity: 0.6; pointer-events: none; }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Word list ---------- */
  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 4px 4px 10px;
  }

  .word-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
    cursor: pointer;
    transition: transform 0.1s, border-color 0.15s;
  }

  .word-card:active { transform: scale(0.985); }

  .word-card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .word-langs { flex: 1; min-width: 0; }

  .word-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin-bottom: 3px;
  }

  .word-line:last-child { margin-bottom: 0; }

  .word-line .flag { font-size: 14px; }

  .word-line .txt {
    font-size: 14.5px;
    word-break: break-word;
  }

  .word-line.primary .txt { font-weight: 700; font-size: 16px; }
  .word-line:not(.primary) .txt { color: var(--text-dim); }

  .known-badge {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card-2);
    color: var(--text-faint);
    font-size: 13px;
  }

  .known-badge.known { background: var(--green-soft); color: var(--green); }

  .empty-state {
    text-align: center;
    color: var(--text-dim);
    padding: 44px 20px;
    font-size: 13.5px;
    line-height: 1.7;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 20px;
  }

  .empty-state .emoji { font-size: 34px; display: block; margin-bottom: 10px; }

  /* ---------- Flashcards ---------- */
  .flash-progress-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .flash-progress-row b { color: var(--accent); }

  .flashcard {
    width: 100%;
    height: 320px;
    perspective: 1400px;
    cursor: pointer;
    margin-bottom: 18px;
  }

  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
    transform-style: preserve-3d;
  }

  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

  .flashcard-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 22px;
    padding: 22px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .flashcard-front {
    background: linear-gradient(160deg, var(--accent), var(--accent-2));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #fff;
  }

  .flashcard-front .flag-big { font-size: 30px; margin-bottom: 12px; }
  .flashcard-front .word-big { font-size: 28px; font-weight: 800; line-height: 1.25; }
  .flashcard-front .flip-hint {
    position: absolute;
    bottom: 16px;
    font-size: 11.5px;
    opacity: 0.75;
    font-weight: 600;
  }

  .flashcard-back {
    background: var(--card);
    border: 1px solid var(--border);
    transform: rotateY(180deg);
    overflow-y: auto;
  }

  .flashcard-back::-webkit-scrollbar { display: none; }

  .fc-lang-row {
    display: flex;
    align-items: baseline;
    gap: 7px;
    margin-bottom: 8px;
  }

  .fc-lang-row .flag { font-size: 15px; }
  .fc-lang-row .txt { font-size: 16px; font-weight: 700; }

  .fc-divider { height: 1px; background: var(--border); margin: 12px 0; }

  .pos-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 3px 8px;
    border-radius: 8px;
    margin-bottom: 5px;
  }

  .meaning-block { margin-bottom: 10px; }
  .meaning-block:last-child { margin-bottom: 0; }

  .meaning-def { font-size: 13.5px; line-height: 1.5; color: var(--text); }

  .meaning-example {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 3px;
    font-style: italic;
    line-height: 1.5;
  }

  .no-details {
    font-size: 12.5px;
    color: var(--text-faint);
    font-style: italic;
  }

  .flash-actions { display: flex; gap: 10px; }

  .btn-repeat, .btn-know {
    flex: 1;
    padding: 15px;
    border-radius: 16px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform 0.1s;
  }

  .btn-repeat:active, .btn-know:active { transform: scale(0.97); }

  .btn-repeat { background: var(--red-soft); color: var(--red); }
  .btn-know { background: linear-gradient(135deg, var(--green), #10b981); color: #06251a; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-top: 1px solid var(--border-soft);
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
  }

  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 4px;
    color: var(--text-faint);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
  }

  .nav-btn svg { width: 23px; height: 23px; }
  .nav-btn.active { color: var(--accent); }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 200;
    display: flex;
    align-items: flex-end;
  }

  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    max-height: 82vh;
    background: var(--card);
    border-radius: 26px 26px 0 0;
    padding: 10px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    overflow-y: auto;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.4);
  }

  .sheet-overlay.open .sheet { transform: translateY(0); }

  .sheet-handle {
    width: 36px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin: 6px auto 14px;
  }

  .sheet-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .sheet-title { font-size: 17px; font-weight: 800; }

  .sheet-close {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--card-2);
    border: none;
    color: var(--text-dim);
    font-size: 15px;
    cursor: pointer;
  }

  .sheet-delete {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border-radius: 14px;
    border: 1px solid var(--red);
    background: var(--red-soft);
    color: var(--red);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-16px);
    background: var(--card-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.22s ease;
    z-index: 999;
    pointer-events: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">

  <header class="app-header">
    <h1>Matura Vocab</h1>
    <div class="sub">🇬🇧 English · 🇵🇱 Polski · 🇷🇺 Русский</div>

    <div class="stats-card">
      <div class="stats-row">
        <span class="label">Изучено слов</span>
        <span class="value"><b id="stat-learned">0</b> / <span id="stat-total">0</span></span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="stat-progress-fill" style="width:0%"></div>
      </div>
    </div>
  </header>

  <main>
    <!-- ==== TAB 1: DICTIONARY ==== -->
    <section id="tab-dictionary" class="tab-content active">
      <div class="add-panel">
        <div class="title">Добавить слово</div>
        <div class="hint">Введи слово или фразу на любом из трёх языков — остальные переводы подставятся автоматически.</div>
        <input id="word-input" class="word-input" type="text" placeholder="Например: give up / kot / привет" autocomplete="off">
        <div class="lang-chips">
          <button class="lang-chip" data-lang="en">🇬🇧 EN</button>
          <button class="lang-chip" data-lang="pl">🇵🇱 PL</button>
          <button class="lang-chip" data-lang="ru">🇷🇺 RU</button>
        </div>
        <button class="btn-add" id="add-btn">Добавить в словарь</button>
      </div>

      <div class="section-title" id="list-title">Мои слова</div>
      <div id="word-list"></div>
    </section>

    <!-- ==== TAB 2: FLASHCARDS ==== -->
    <section id="tab-flashcards" class="tab-content">
      <div id="flash-wrap"></div>
    </section>
  </main>

</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="dictionary">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Словарь</span>
  </button>
  <button class="nav-btn" data-tab="flashcards">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="14" rx="3"/><path d="M7.5 7V5.5A2.5 2.5 0 0 1 10 3h9a2.5 2.5 0 0 1 2.5 2.5v9a2.5 2.5 0 0 1-2.5 2.5H18"/></svg>
    <span>Карточки</span>
  </button>
</nav>

<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-top-row">
      <span class="sheet-title">Обзор слова</span>
      <button class="sheet-close" id="sheet-close">✕</button>
    </div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  const STORAGE_KEY = 'matura_vocab_v1';
  const FLAGS = { en: '🇬🇧', pl: '🇵🇱', ru: '🇷🇺' };
  const LANG_NAMES = { en: 'English', pl: 'Polski', ru: 'Русский' };

  function loadWords() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }

  function saveWords(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  let words = loadWords();

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // ---------- Toast ----------
  function showToast(text) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // ---------- Stats ----------
  function renderStats() {
    const total = words.length;
    const learned = words.filter(w => w.known).length;
    const pct = total ? Math.round((learned / total) * 100) : 0;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-learned').textContent = learned;
    document.getElementById('stat-progress-fill').style.width = pct + '%';
    document.getElementById('list-title').textContent = `Мои слова (${total})`;
  }

  // ---------- Tabs ----------
  const navButtons = document.querySelectorAll('.nav-btn');
  const tabContents = document.querySelectorAll('.tab-content');

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      navButtons.forEach(b => b.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'flashcards') initFlashcards();
      tg?.HapticFeedback?.impactOccurred('light');
    });
  });

  // ---------- Language detection ----------
  function detectLang(text) {
    if (/[\u0400-\u04FF]/.test(text)) return 'ru';
    if (/[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]/.test(text)) return 'pl';
    return 'en';
  }

  // ---------- Lang chip override ----------
  const langChips = document.querySelectorAll('.lang-chip');
  const wordInput = document.getElementById('word-input');
  let manualLang = null;

  function highlightChip(lang) {
    langChips.forEach(c => c.classList.toggle('active', c.dataset.lang === lang));
  }

  wordInput.addEventListener('input', () => {
    const guess = manualLang || detectLang(wordInput.value.trim());
    highlightChip(guess);
  });

  langChips.forEach(chip => {
    chip.addEventListener('click', () => {
      manualLang = chip.dataset.lang;
      highlightChip(manualLang);
      tg?.HapticFeedback?.selectionChanged();
    });
  });

  // ---------- Translation API (MyMemory) ----------
  async function translateText(text, from, to) {
    const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('translate_failed');
    const data = await res.json();
    const translated = data?.responseData?.translatedText || '';
    if (!translated || /MYMEMORY WARNING/i.test(translated)) {
      throw new Error('translate_quota');
    }
    return translated;
  }

  // ---------- Dictionary details (English only) ----------
  async function fetchDictionaryDetails(enWord) {
    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(enWord.toLowerCase())}`);
      if (!res.ok) return null;
      const data = await res.json();
      const entry = data[0];
      if (!entry || !entry.meanings) return null;
      const meanings = entry.meanings.slice(0, 3).map(m => {
        const def = m.definitions?.[0];
        return {
          partOfSpeech: m.partOfSpeech || '',
          definition: def?.definition || '',
          example: def?.example || ''
        };
      }).filter(m => m.definition);
      return meanings.length ? { meanings } : null;
    } catch (e) {
      return null;
    }
  }

  // ---------- Add word ----------
  const addBtn = document.getElementById('add-btn');

  addBtn.addEventListener('click', async () => {
    const raw = wordInput.value.trim();
    if (!raw) {
      showToast('Введи слово или фразу');
      tg?.HapticFeedback?.notificationOccurred('error');
      return;
    }

    const source = manualLang || detectLang(raw);
    const targets = ['en', 'pl', 'ru'].filter(l => l !== source);

    addBtn.disabled = true;
    addBtn.innerHTML = `<span class="spinner"></span>Переводим…`;

    try {
      const [t1, t2] = await Promise.all([
        translateText(raw, source, targets[0]),
        translateText(raw, source, targets[1])
      ]);

      const entry = { en: '', pl: '', ru: '' };
      entry[source] = raw;
      entry[targets[0]] = t1;
      entry[targets[1]] = t2;

      let details = null;
      if (entry.en) {
        details = await fetchDictionaryDetails(entry.en);
      }

      const newWord = {
        id: Date.now(),
        en: entry.en,
        pl: entry.pl,
        ru: entry.ru,
        sourceLang: source,
        details,
        known: false
      };

      words.push(newWord);
      saveWords(words);

      wordInput.value = '';
      manualLang = null;
      highlightChip(detectLang(''));
      langChips.forEach(c => c.classList.remove('active'));

      renderWordList();
      showToast('Слово добавлено');
      tg?.HapticFeedback?.notificationOccurred('success');
    } catch (e) {
      const msg = e.message === 'translate_quota'
        ? 'Лимит бесплатных переводов исчерпан, попробуй позже'
        : 'Не удалось перевести. Проверь соединение';
      showToast(msg);
      tg?.HapticFeedback?.notificationOccurred('error');
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = 'Добавить в словарь';
    }
  });

  wordInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addBtn.click();
  });

  // ---------- Render meanings (shared by sheet + flashcard back) ----------
  function renderMeanings(details) {
    if (!details || !details.meanings || !details.meanings.length) {
      return `<div class="no-details">Подробный разбор для этого слова недоступен — доступны только переводы.</div>`;
    }
    return details.meanings.map(m => `
      <div class="meaning-block">
        ${m.partOfSpeech ? `<span class="pos-badge">${escapeHtml(m.partOfSpeech)}</span>` : ''}
        <div class="meaning-def">${escapeHtml(m.definition)}</div>
        ${m.example ? `<div class="meaning-example">“${escapeHtml(m.example)}”</div>` : ''}
      </div>
    `).join('');
  }

  function renderTranslationRows(word, excludeSource) {
    const order = ['en', 'pl', 'ru'];
    return order.map(lang => `
      <div class="fc-lang-row">
        <span class="flag">${FLAGS[lang]}</span>
        <span class="txt">${escapeHtml(word[lang] || '—')}</span>
      </div>
    `).join('');
  }

  // ---------- Word list (dictionary tab) ----------
  const wordListEl = document.getElementById('word-list');

  function renderWordList() {
    wordListEl.innerHTML = '';
    renderStats();

    if (words.length === 0) {
      wordListEl.innerHTML = `
        <div class="empty-state">
          <span class="emoji">🗂️</span>
          Словарь пуст.<br>Добавь первое слово выше — переводы на два других языка подставятся сами.
        </div>`;
      return;
    }

    [...words].reverse().forEach(w => {
      const card = document.createElement('div');
      card.className = 'word-card';
      card.innerHTML = `
        <div class="word-card-top">
          <div class="word-langs">
            <div class="word-line primary"><span class="flag">🇬🇧</span><span class="txt">${escapeHtml(w.en || '—')}</span></div>
            <div class="word-line"><span class="flag">🇵🇱</span><span class="txt">${escapeHtml(w.pl || '—')}</span></div>
            <div class="word-line"><span class="flag">🇷🇺</span><span class="txt">${escapeHtml(w.ru || '—')}</span></div>
          </div>
          <div class="known-badge ${w.known ? 'known' : ''}">${w.known ? '✓' : '·'}</div>
        </div>
      `;
      card.addEventListener('click', () => openSheet(w.id));
      wordListEl.appendChild(card);
    });
  }

  renderWordList();

  // ---------- Bottom sheet (full detail) ----------
  const sheetOverlay = document.getElementById('sheet-overlay');
  const sheetBody = document.getElementById('sheet-body');

  function openSheet(wordId) {
    const w = words.find(x => x.id === wordId);
    if (!w) return;

    sheetBody.innerHTML = `
      ${renderTranslationRows(w)}
      <div class="fc-divider"></div>
      ${renderMeanings(w.details)}
      <button class="sheet-delete" id="sheet-delete-btn">Удалить слово</button>
    `;

    document.getElementById('sheet-delete-btn').addEventListener('click', () => {
      words = words.filter(x => x.id !== wordId);
      saveWords(words);
      closeSheet();
      renderWordList();
      tg?.HapticFeedback?.notificationOccurred('warning');
      showToast('Слово удалено');
    });

    sheetOverlay.classList.add('open');
    tg?.HapticFeedback?.impactOccurred('light');
  }

  function closeSheet() {
    sheetOverlay.classList.remove('open');
  }

  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  sheetOverlay.addEventListener('click', (e) => {
    if (e.target === sheetOverlay) closeSheet();
  });

  // ---------- Flashcards ----------
  const flashWrap = document.getElementById('flash-wrap');
  let deck = [];
  let deckTotal = 0;
  let currentIndex = 0;

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initFlashcards() {
    words = loadWords();
    if (words.length === 0) {
      flashWrap.innerHTML = `
        <div class="empty-state">
          <span class="emoji">📭</span>
          Пока нет слов для тренировки.<br>Добавь их во вкладке «Словарь».
        </div>`;
      return;
    }
    deck = shuffle(words);
    deckTotal = deck.length;
    currentIndex = 0;
    renderCard();
  }

  function renderCard() {
    if (currentIndex >= deck.length) {
      flashWrap.innerHTML = `
        <div class="empty-state">
          <span class="emoji">🎉</span>
          Все карточки пройдены!<br>Отличная работа перед Matura.
        </div>
        <button class="btn-add" id="restart-btn" style="margin-top:16px;">Начать заново</button>
      `;
      document.getElementById('restart-btn').addEventListener('click', initFlashcards);
      return;
    }

    const card = deck[currentIndex];

    flashWrap.innerHTML = `
      <div class="flash-progress-row">
        <span>Карточка <b>${currentIndex + 1}</b> из ${deckTotal}</span>
        <span>${Math.round((currentIndex / deckTotal) * 100)}%</span>
      </div>

      <div class="flashcard" id="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="flag-big">🇬🇧</div>
            <div class="word-big">${escapeHtml(card.en || '—')}</div>
            <span class="flip-hint">Нажми, чтобы увидеть перевод</span>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="fc-lang-row"><span class="flag">🇵🇱</span><span class="txt">${escapeHtml(card.pl || '—')}</span></div>
            <div class="fc-lang-row"><span class="flag">🇷🇺</span><span class="txt">${escapeHtml(card.ru || '—')}</span></div>
            <div class="fc-divider"></div>
            ${renderMeanings(card.details)}
          </div>
        </div>
      </div>

      <div class="flash-actions">
        <button class="btn-repeat" id="btn-repeat">Повторить</button>
        <button class="btn-know" id="btn-know">Знаю</button>
      </div>
    `;

    const flashcardEl = document.getElementById('flashcard');
    flashcardEl.addEventListener('click', () => {
      flashcardEl.classList.toggle('flipped');
      tg?.HapticFeedback?.impactOccurred('light');
    });

    document.getElementById('btn-know').addEventListener('click', (e) => {
      e.stopPropagation();
      const original = words.find(w => w.id === card.id);
      if (original) {
        original.known = true;
        saveWords(words);
        renderStats();
      }
      tg?.HapticFeedback?.notificationOccurred('success');
      nextCard();
    });

    document.getElementById('btn-repeat').addEventListener('click', (e) => {
      e.stopPropagation();
      deck.push(card);
      tg?.HapticFeedback?.notificationOccurred('warning');
      nextCard();
    });
  }

  function nextCard() {
    currentIndex++;
    renderCard();
  }
</script>

</body>
</html>
